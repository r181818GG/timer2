<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="./main.js"></script>

  <div class="app">
    <h1>Мини-приложение «Время»</h1>
    <p id="greeting"></p>

    <section class="block">
      <h2>Часы</h2>
      <div id="clock" class="digits">00:00:00</div>
      <div id="date"></div>
    </section>

    <section class="block">
      <h2>Секундомер</h2>
      <div id="stopwatch" class="digits">00:00.0</div>
      <button id="swStart">Старт</button>
      <button id="swStop">Стоп</button>
      <button id="swReset">Сброс</button>
    </section>

    <section class="block">
      <h2>Таймер</h2>
      <input id="timerInput" type="number" min="1" value="10"> сек.
      <button id="timerStart">Старт</button>
      <div id="timerView" class="digits">00:10</div>
      <p id="timerMsg"></p>
    </section>
  </div>

  <h2>До Нового года осталось: <span id="newYear"></span> дней</h2>

<button id="swLap">Круг</button>
<ul id="laps"></ul>

<button id="timerReset">Сброс таймера</button>

<h2>Будильник</h2>
<input type="time" id="alarmInput">
<button id="alarmStart">Установить</button>
<p id="alarmMsg"></p>

</body>
</html>
